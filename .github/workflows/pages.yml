name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
# Build and validation run without Pages rights; only the deploy job may publish, and it runs no third-party npm code.
# Third-party actions are pinned to a commit SHA (comment = tag), html-validate to an exact version.
jobs:
  build:
    # Runs only in the public site repo tillheidrich/fieravend-site (Pages needs a public repo without GitHub Pro). The private mirror syncs site/ there via sync-site.yml.
    if: github.repository == 'tillheidrich/fieravend-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build site (includes contrast check)
        run: node site/build.mjs
      - name: Validate HTML
        run: npx --yes html-validate@11.16.4 "site/dist/**/*.html" -c site/.htmlvalidate.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
  deploy:
    needs: build
    if: github.repository == 'tillheidrich/fieravend-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
